<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Twitch</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="card">
        <div class="label">SUBS</div>
        <div class="value" id="subsCurrent">0</div>
    </div>

    <div class="card">
        <div class="label">BITS</div>
        <div class="value" id="bitsCurrent">0</div>
    </div>

    <div class="doubles-column">

        <div class="card double-card">
            <div class="label double-label">AVAS</div>
            <div class="value double-value" id="avasCurrent">0</div>
        </div>

        <div class="card double-card">
            <div class="label double-label">COFRES</div>
            <div class="value double-value" id="cofresCurrent">0</div>
        </div>

    </div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
