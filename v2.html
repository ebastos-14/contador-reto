<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contador Reto V2</title>

<link rel="stylesheet" href="css/styles.css">

<style>
/* Solo layout */

.container {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    padding: 20px;
}

.current-counters {
    display: flex;
    gap: 20px;
}

.total-counters {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* Opcional:
   Totales un poco más compactos
*/
.total-counters .card {
    min-width: 100px;
    padding: 10px 18px;
}

.total-counters .label {
    font-size: 16px;
}

.total-counters .value {
    font-size: 28px;
}
</style>
</head>

<body>

<div class="container">

    <!-- CONTADORES ACTUALES -->

    <div class="current-counters">

        <div class="card">
            <div class="label">SUBS HOY</div>
            <div class="value" id="subsCurrent">0</div>
        </div>

        <div class="card">
            <div class="label">BITS HOY</div>
            <div class="value" id="bitsCurrent">0</div>
        </div>

    </div>

    <!-- TOTALES -->

    <div class="total-counters">

        <div class="card">
            <div class="label">TOTAL SUBS</div>
            <div class="value" id="subsTotal">0</div>
        </div>

        <div class="card">
            <div class="label">TOTAL BITS</div>
            <div class="value" id="bitsTotal">0</div>
        </div>

    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyCn_diQLgCbhiL9vu5aFtABR7n0ORvd7Ps",
    authDomain: "contador-reto.firebaseapp.com",
    databaseURL: "https://contador-reto-default-rtdb.firebaseio.com",
    projectId: "contador-reto",
    storageBucket: "contador-reto.firebasestorage.app",
    messagingSenderId: "704169660240",
    appId: "1:704169660240:web:1a4b3e35a9498292c0e655"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const countersRef = ref(db, "counters");

onValue(countersRef, (snapshot) => {

    const data = snapshot.val();

    if (!data) return;

    // ACTUALES

    document.getElementById("subsCurrent").textContent =
        data?.current?.subs ?? 0;

    document.getElementById("bitsCurrent").textContent =
        data?.current?.bits ?? 0;

    // TOTALES

    document.getElementById("subsTotal").textContent =
        data?.total?.subs ?? 0;

    document.getElementById("bitsTotal").textContent =
        data?.total?.bits ?? 0;

});

</script>

</body>
</html>
