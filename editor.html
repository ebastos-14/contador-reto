<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pro Gradient Editor</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>

<style>
body {
    margin: 0;
    display: flex;
    font-family: Arial;
    background: #0d0d0d;
    color: white;
    height: 100vh;
}

/* =========================
   PANEL
========================= */
.panel {
    width: 45%;
    background: #1a1a1a;
    padding: 20px;
    overflow-y: auto;
}

.section {
    margin-bottom: 22px;
    padding: 15px;
    border: 1px solid #333;
    border-radius: 12px;
}

h3 {
    margin: 0 0 12px 0;
    font-size: 16px;
    color: #ddd;
}

/* =========================
   ROW LAYOUT (HORIZONTAL)
========================= */
.row {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
}

/* pickr button container */
.color-box {
    width: 100%;
}

/* make pickr buttons bigger */
.pcr-button {
    width: 100% !important;
    height: 45px !important;
    border-radius: 8px !important;
}

/* =========================
   PREVIEW
========================= */
.preview {
    width: 55%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
}

.card {
    position: relative;
    padding: 28px;
    border-radius: 15px;
    min-width: 180px;
    text-align: center;
}

/* BORDER */
.card::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 2px;
    border-radius: 15px;

    background: linear-gradient(45deg, var(--b1), var(--b2));

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;

    pointer-events: none;
}

/* TEXT */
.label {
    font-size: 20px;
    background: linear-gradient(45deg, var(--l1), var(--l2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.value {
    font-size: 44px;
    font-weight: bold;
    background: linear-gradient(45deg, var(--v1), var(--v2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
</style>

</head>

<body>

<div class="panel">

    <!-- BORDER -->
    <div class="section">
        <h3>Border Gradient</h3>
        <div class="row">
            <div id="b1" class="color-box"></div>
            <div id="b2" class="color-box"></div>
        </div>
    </div>

    <!-- LABEL -->
    <div class="section">
        <h3>Text Label</h3>
        <div class="row">
            <div id="l1" class="color-box"></div>
            <div id="l2" class="color-box"></div>
        </div>
    </div>

    <!-- VALUE -->
    <div class="section">
        <h3>Text Value</h3>
        <div class="row">
            <div id="v1" class="color-box"></div>
            <div id="v2" class="color-box"></div>
        </div>
    </div>

    <!-- SHADOW -->
    <div class="section">
        <h3>Shadow Card</h3>
        <div class="row">
            <div id="s1" class="color-box"></div>
            <div id="s2" class="color-box"></div>
        </div>
    </div>

</div>

<div class="preview">
    <div class="card">
        <div class="label">SUBS</div>
        <div class="value">12</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

<script>

const state = {
    b1:"#9146FF", b2:"#ff4fd8",
    l1:"#ffffff", l2:"#ffb3d9",
    v1:"#ffffff", v2:"#ffffff",
    s1:"#9146FF", s2:"#ff4fd8"
};

function apply() {

    document.documentElement.style.setProperty("--b1", state.b1);
    document.documentElement.style.setProperty("--b2", state.b2);

    document.documentElement.style.setProperty("--l1", state.l1);
    document.documentElement.style.setProperty("--l2", state.l2);

    document.documentElement.style.setProperty("--v1", state.v1);
    document.documentElement.style.setProperty("--v2", state.v2);

    document.querySelector(".card").style.boxShadow =
        `0 0 25px ${state.s1}88, 0 0 50px ${state.s2}55`;
}

/* PICKR */
function picker(id, key) {
    return Pickr.create({
        el: document.getElementById(id),
        theme: 'classic',
        default: state[key],

        components: {
            preview: true,
            opacity: false,
            hue: true,
            interaction: {
                hex: true,
                input: true,
                save: true
            }
        }
    }).on('change', (c) => {
        state[key] = c.toHEXA().toString();
        apply();
    });
}

/* INIT */
picker("b1","b1");
picker("b2","b2");
picker("l1","l1");
picker("l2","l2");
picker("v1","v1");
picker("v2","v2");
picker("s1","s1");
picker("s2","s2");

apply();
    
</script>

</body>
</html>
