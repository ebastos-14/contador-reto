<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gradient UI Editor</title>

<style>
body {
    margin: 0;
    display: flex;
    font-family: Arial;
    background: #0d0d0d;
    color: white;
    height: 100vh;
}

/* =========================
   PANEL
========================= */
.panel {
    width: 45%;
    background: #1a1a1a;
    padding: 20px;
    overflow-y: auto;
}

.section {
    margin-bottom: 20px;
    padding: 15px;
    border: 1px solid #333;
    border-radius: 10px;
}

h3 {
    margin: 0 0 10px 0;
}

/* =========================
   PREVIEW
========================= */
.preview {
    width: 55%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
}

.card {
    position: relative;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    min-width: 160px;
    background: transparent;
}

/* BORDER */
.card::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 2px;
    border-radius: 15px;

    background: linear-gradient(45deg, var(--b1), var(--b2));

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;

    pointer-events: none;
}

/* =========================
   TEXT GRADIENTS
========================= */
.label {
    font-size: 18px;
    background: linear-gradient(45deg, var(--l1), var(--l2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.value {
    font-size: 40px;
    font-weight: bold;
    background: linear-gradient(45deg, var(--v1), var(--v2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* =========================
   INPUTS
========================= */
.row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
}

input[type="color"] {
    width: 45px;
    height: 35px;
    border: none;
    background: none;
}

.hex {
    width: 90px;
    padding: 5px;
    background: #111;
    border: 1px solid #444;
    color: white;
}
</style>

</head>

<body>

<!-- =========================
   PANEL
========================= -->
<div class="panel">

    <div class="section">
        <h3>Border Card</h3>
        <div class="row"><input type="color" id="b1c"><input class="hex" id="b1h"></div>
        <div class="row"><input type="color" id="b2c"><input class="hex" id="b2h"></div>
    </div>

    <div class="section">
        <h3>Text Label</h3>
        <div class="row"><input type="color" id="l1c"><input class="hex" id="l1h"></div>
        <div class="row"><input type="color" id="l2c"><input class="hex" id="l2h"></div>
    </div>

    <div class="section">
        <h3>Text Value</h3>
        <div class="row"><input type="color" id="v1c"><input class="hex" id="v1h"></div>
        <div class="row"><input type="color" id="v2c"><input class="hex" id="v2h"></div>
    </div>

    <div class="section">
        <h3>Shadow Card</h3>
        <div class="row"><input type="color" id="s1c"><input class="hex" id="s1h"></div>
        <div class="row"><input type="color" id="s2c"><input class="hex" id="s2h"></div>
    </div>

</div>

<!-- =========================
   PREVIEW
========================= -->
<div class="preview">
    <div class="card" id="card">
        <div class="label">SUBS</div>
        <div class="value">12</div>
    </div>
</div>

<script>
/* =========================
   HEX SYNC
========================= */
function bind(c, h) {
    c.addEventListener("input", () => h.value = c.value);
    h.addEventListener("input", () => c.value = h.value);
    c.addEventListener("input", apply);
    h.addEventListener("input", apply);
}

/* =========================
   APPLY SYSTEM
========================= */
function apply() {

    // BORDER
    document.documentElement.style.setProperty("--b1", b1c.value);
    document.documentElement.style.setProperty("--b2", b2c.value);

    // LABEL TEXT
    document.documentElement.style.setProperty("--l1", l1c.value);
    document.documentElement.style.setProperty("--l2", l2c.value);

    // VALUE TEXT
    document.documentElement.style.setProperty("--v1", v1c.value);
    document.documentElement.style.setProperty("--v2", v2c.value);

    // SHADOW
    document.getElementById("card").style.boxShadow =
        `0 0 20px ${s1c.value}88, 0 0 40px ${s2c.value}55`;
}

/* =========================
   INIT BINDINGS
========================= */
const ids = ["b1","b2","l1","l2","v1","v2","s1","s2"];

ids.forEach(id => {
    bind(
        document.getElementById(id + "c"),
        document.getElementById(id + "h")
    );
});

/* DEFAULT APPLY */
apply();
</script>

</body>
</html>
