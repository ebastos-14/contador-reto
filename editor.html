<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pro Gradient Editor</title>

<!-- =========================
     PICKR LIBRARY (CDN)
========================= -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>

<style>
body {
    margin: 0;
    display: flex;
    font-family: Arial;
    background: #0d0d0d;
    color: white;
    height: 100vh;
}

.panel {
    width: 45%;
    background: #1a1a1a;
    padding: 20px;
    overflow-y: auto;
}

.section {
    margin-bottom: 20px;
    padding: 15px;
    border: 1px solid #333;
    border-radius: 10px;
}

h3 {
    margin: 0 0 10px 0;
}

.preview {
    width: 55%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
}

.card {
    position: relative;
    padding: 25px;
    border-radius: 15px;
    min-width: 160px;
    text-align: center;
}

/* BORDER GRADIENT */
.card::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 2px;
    border-radius: 15px;

    background: linear-gradient(45deg, var(--b1), var(--b2));

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;

    pointer-events: none;
}

/* TEXT */
.label {
    font-size: 18px;
    background: linear-gradient(45deg, var(--l1), var(--l2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.value {
    font-size: 40px;
    font-weight: bold;
    background: linear-gradient(45deg, var(--v1), var(--v2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* COLOR BUTTONS */
.color-btn {
    width: 100%;
    padding: 8px;
    margin-top: 10px;
    background: #222;
    border: 1px solid #444;
    cursor: pointer;
    border-radius: 5px;
}
</style>

</head>

<body>

<!-- =========================
     PANEL
========================= -->
<div class="panel">

    <div class="section">
        <h3>Border Color 1</h3>
        <div id="b1"></div>

        <h3>Border Color 2</h3>
        <div id="b2"></div>
    </div>

    <div class="section">
        <h3>Text Label</h3>
        <div id="l1"></div>
        <div id="l2"></div>
    </div>

    <div class="section">
        <h3>Text Value</h3>
        <div id="v1"></div>
        <div id="v2"></div>
    </div>

</div>

<!-- =========================
     PREVIEW
========================= -->
<div class="preview">
    <div class="card">
        <div class="label">SUBS</div>
        <div class="value">12</div>
    </div>
</div>

<!-- =========================
     PICKR SCRIPT
========================= -->
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

<script>
/* =========================
   STATE
========================= */
const state = {
    b1: "#9146FF",
    b2: "#ff4fd8",
    l1: "#ffffff",
    l2: "#ffb3d9",
    v1: "#ffffff",
    v2: "#ffffff"
};

/* =========================
   APPLY
========================= */
function apply() {
    document.documentElement.style.setProperty("--b1", state.b1);
    document.documentElement.style.setProperty("--b2", state.b2);

    document.documentElement.style.setProperty("--l1", state.l1);
    document.documentElement.style.setProperty("--l2", state.l2);

    document.documentElement.style.setProperty("--v1", state.v1);
    document.documentElement.style.setProperty("--v2", state.v2);
}

/* =========================
   PICKR FACTORY
========================= */
function createPicker(id, key) {
    return Pickr.create({
        el: document.getElementById(id),
        theme: 'classic',

        default: state[key],

        components: {
            preview: true,
            opacity: false,
            hue: true,

            interaction: {
                hex: true,
                rgba: true,
                input: true,
                save: true
            }
        }
    }).on('change', (color) => {
        state[key] = color.toHEXA().toString();
        apply();
    });
}

/* =========================
   INIT PICKERS
========================= */
createPicker("b1", "b1");
createPicker("b2", "b2");
createPicker("l1", "l1");
createPicker("l2", "l2");
createPicker("v1", "v1");
createPicker("v2", "v2");

/* INIT */
apply();
</script>

</body>
</html>
