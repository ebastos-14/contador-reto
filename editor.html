<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay Editor</title>
<link rel="stylesheet" href="editor.css">
</head>

<body>

<div class="layout">

    <!-- PANEL EDITOR -->
    <div class="panel">

        <h2>Editor Overlay</h2>

        <!-- SUBS COLOR -->
        <div class="section">
            <h3>Color SUBS</h3>

            <div class="row">
                <div class="box" id="subsCurrent"></div>
                <div class="box" id="subsNew"></div>
            </div>

            <div class="row">
                <input type="text" id="subsHex" placeholder="#9146FF">
                <input type="color" id="subsPicker">
            </div>
        </div>

        <!-- BITS COLOR -->
        <div class="section">
            <h3>Color BITS</h3>

            <div class="row">
                <div class="box" id="bitsCurrent"></div>
                <div class="box" id="bitsNew"></div>
            </div>

            <div class="row">
                <input type="text" id="bitsHex" placeholder="#FFD54F">
                <input type="color" id="bitsPicker">
            </div>
        </div>

        <!-- TEXTO -->
        <div class="section">
            <h3>Texto</h3>

            <input type="text" id="fontFamily" placeholder="Arial, Roboto...">
            <input type="range" id="fontSize" min="10" max="80">

            <p id="fontPreview">Preview Texto</p>
        </div>

        <!-- BOTONES -->
        <div class="buttons">
            <button id="save">Guardar estilo</button>
            <button id="reset">Restaurar default</button>
        </div>

    </div>

    <!-- PREVIEW -->
    <div class="preview">
        <iframe src="index.html" id="frame"></iframe>
    </div>

</div>

<script src="editor.js"></script>

</body>
</html>
