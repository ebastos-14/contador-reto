<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gradient Picker Pro</title>

<style>
body {
    margin: 0;
    display: flex;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
    height: 100vh;
}

/* =========================
   PANEL
========================= */
.panel {
    width: 45%;
    background: #1a1a1a;
    padding: 20px;
    overflow-y: auto;
}

.section {
    margin-bottom: 20px;
    padding: 15px;
    border: 1px solid #333;
    border-radius: 10px;
}

h3 {
    margin-top: 0;
}

/* =========================
   PREVIEW
========================= */
.preview {
    width: 55%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
}

.card {
    position: relative;
    padding: 25px;
    border-radius: 15px;
    min-width: 160px;
    text-align: center;
    background: var(--bg);
    color: var(--text);
    box-shadow: var(--shadow);
}

/* BORDER GRADIENT */
.card::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 2px;
    border-radius: 15px;

    background: linear-gradient(
        45deg,
        var(--b1),
        var(--b2)
    );

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;

    pointer-events: none;
}

/* =========================
   TEXT GRADIENT
========================= */
.label, .value {
    background: linear-gradient(
        45deg,
        var(--t1),
        var(--t2)
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.label {
    font-size: 18px;
}

.value {
    font-size: 40px;
    font-weight: bold;
}

/* =========================
   INPUTS
========================= */
.row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
}

input[type="color"] {
    width: 50px;
    height: 35px;
    border: none;
    background: none;
}

.hex {
    width: 90px;
    background: #111;
    border: 1px solid #444;
    color: white;
    padding: 5px;
}
</style>

</head>

<body>

<!-- =========================
     PANEL
========================= -->
<div class="panel">

    <div class="section">
        <h3>Border Gradient</h3>
        <div class="row">
            <input type="color" id="b1c">
            <input class="hex" id="b1h">
        </div>
        <div class="row">
            <input type="color" id="b2c">
            <input class="hex" id="b2h">
        </div>
    </div>

    <div class="section">
        <h3>Text Gradient</h3>
        <div class="row">
            <input type="color" id="t1c">
            <input class="hex" id="t1h">
        </div>
        <div class="row">
            <input type="color" id="t2c">
            <input class="hex" id="t2h">
        </div>
    </div>

    <div class="section">
        <h3>Background</h3>
        <div class="row">
            <input type="color" id="bgc">
            <input class="hex" id="bgh">
        </div>
    </div>

    <div class="section">
        <h3>Shadow</h3>
        <div class="row">
            <input type="color" id="s1c">
            <input class="hex" id="s1h">
        </div>
        <div class="row">
            <input type="color" id="s2c">
            <input class="hex" id="s2h">
        </div>
    </div>

</div>

<!-- =========================
     PREVIEW
========================= -->
<div class="preview">
    <div class="card">
        <div class="label">SUBS</div>
        <div class="value">12</div>
    </div>
</div>

<script>
/* =========================
   UTIL HEX SYNC
========================= */
function sync(color, hex) {
    color.addEventListener("input", () => hex.value = color.value);
    hex.addEventListener("input", () => color.value = hex.value);
}

/* =========================
   APPLY SYSTEM
========================= */
function apply() {

    document.documentElement.style.setProperty("--b1", b1c.value);
    document.documentElement.style.setProperty("--b2", b2c.value);

    document.documentElement.style.setProperty("--t1", t1c.value);
    document.documentElement.style.setProperty("--t2", t2c.value);

    document.documentElement.style.setProperty("--bg", bgc.value);

    document.documentElement.style.setProperty("--s1", s1c.value);
    document.documentElement.style.setProperty("--s2", s2c.value);

    document.querySelector(".card").style.boxShadow =
        `0 0 20px ${s1c.value}88, 0 0 40px ${s2c.value}44`;
}

/* =========================
   INIT SYNC
========================= */
const ids = [
    "b1","b2","t1","t2","bg","s1","s2"
];

ids.forEach(id => {
    const c = document.getElementById(id + "c");
    const h = document.getElementById(id + "h");

    sync(c, h);
    c.addEventListener("input", apply);
    h.addEventListener("input", apply);
});

/* INIT DEFAULT */
apply();
</script>

</body>
</html>
